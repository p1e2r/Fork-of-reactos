name: Lumen ISO
# Builds a bootable ISO with the Windows 11-style Lumen look on every push.
on:
  push:
    branches-ignore: [screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    strategy:
      matrix:
        arch: [i386, amd64]
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
    - name: Get RosBE build specifics
      id: get_rosbe_spec
      run: |
        echo march-sha=$(gcc -march=native -Q --help=target | sha1sum | awk '{print $1}') >> $GITHUB_OUTPUT
        echo git-sha=$(git ls-remote https://github.com/zefklop/RosBE.git | grep unix_amd64 | awk '{print $1}') >> $GITHUB_OUTPUT
        wget https://gist.githubusercontent.com/zefklop/b2d6a0b470c70183e93d5285a03f5899/raw/build_rosbe_ci.sh
        sed -i '/gcc-8.4.0\/gcc-8.4.0.tar.xz/c\wget https://ftpmirror.gnu.org/gcc/gcc-8.4.0/gcc-8.4.0.tar.xz || wget -L https://web.archive.org/web/2025if_/https://ftpmirror.gnu.org/gcc/gcc-8.4.0/gcc-8.4.0.tar.xz' ./build_rosbe_ci.sh
        sed -i '/mingw-w64-v6.0.0.tar.bz2\/download/c\wget -O mingw-w64-v6.0.0.tar.bz2 https://sourceforge.net/projects/mingw-w64/files/mingw-w64/mingw-w64-release/mingw-w64-v6.0.0.tar.bz2/download && bzip2 -t mingw-w64-v6.0.0.tar.bz2 || (wget -O - https://github.com/mingw-w64/mingw-w64/archive/refs/tags/v6.0.0.tar.gz | tar -xz && mv mingw-w64-6.0.0 mingw-w64-v6.0.0 && tar -cjf mingw-w64-v6.0.0.tar.bz2 mingw-w64-v6.0.0 && rm -rf mingw-w64-v6.0.0)' ./build_rosbe_ci.sh
    - name: Get RosBE
      id: get_rosbe
      uses: actions/cache@v5
      with:
        path: RosBE-CI
        key: RosBE-CI-${{runner.os}}-${{steps.get_rosbe_spec.outputs.march-sha}}-${{steps.get_rosbe_spec.outputs.git-sha}}-${{hashfiles('./build_rosbe_ci.sh')}}
    - name: Compile RosBE
      if: ${{ steps.get_rosbe.outputs.cache-hit != 'true' }}
      run: |
        chmod +x build_rosbe_ci.sh
        ./build_rosbe_ci.sh ${{github.workspace}}/RosBE-CI
        test -x ${{github.workspace}}/RosBE-CI/RosBE.sh || { echo "::error::RosBE build failed"; exit 1; }
    - name: Install ccache
      run: sudo apt install ccache
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        path: src
    - name: Set up cache for ccache
      uses: actions/cache@v5
      with:
        path: ccache
        key: ccache-lumen-${{matrix.arch}}-${{github.sha}}
        restore-keys: |
          ccache-lumen-${{matrix.arch}}-
    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV
        echo "CCACHE_COMPILERCHECK=string:${{steps.get_rosbe_spec.outputs.git-sha}}-${{hashfiles('./build_rosbe_ci.sh')}}" >> $GITHUB_ENV
    - name: Configure problem matchers
      run: echo ::add-matcher::src/.github/workflows/problem-matcher.json
    - name: Configure
      run: echo 'cmake -S ${{github.workspace}}/src -B ${{github.workspace}}/build -G Ninja -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-gcc.cmake -DARCH:STRING=${{matrix.arch}} -DCMAKE_BUILD_TYPE=Release -DENABLE_CCACHE=1' | ${{github.workspace}}/RosBE-CI/RosBE.sh . 0 ${{matrix.arch}}
    - name: Build
      run: set -o pipefail && echo 'cmake --build ${{github.workspace}}/build -- -k0' | ${{github.workspace}}/RosBE-CI/RosBE.sh . 0 ${{matrix.arch}} 2>&1 | sed 's|^\.\./src/|${{github.workspace}}/src/|'
    - name: Generate ISOs
      run: echo 'cmake --build ${{github.workspace}}/build --target bootcd livecd' | ${{github.workspace}}/RosBE-CI/RosBE.sh . 0 ${{matrix.arch}}
    - name: Upload ISOs
      uses: actions/upload-artifact@v7
      with:
        name: lumen-${{matrix.arch}}-${{github.sha}}
        path: |
          build/bootcd.iso
          build/liveimg.iso
    - name: Boot LiveCD and take screenshots
      if: ${{ matrix.arch == 'i386' }}
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 imagemagick socat
        ACCEL=""
        if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ACCEL="-enable-kvm"; fi
        mkdir -p shots
        qemu-system-i386 $ACCEL -m 1024 -cdrom build/liveimg.iso -boot d -vga std \
          -display none -monitor unix:/tmp/qmon,server,nowait -serial file:shots/serial.log &
        for t in 60 120 180 240 300 420; do
          sleep $(( t - ${prev:-0} )); prev=$t
          echo "screendump /tmp/shot-$t.ppm" | socat - UNIX-CONNECT:/tmp/qmon || true
          sleep 2; convert /tmp/shot-$t.ppm shots/livecd-$t.png || true
        done
        kill %1 || true
    - name: Publish screenshots to the screenshots branch
      if: ${{ matrix.arch == 'i386' }}
      run: |
        cd shots
        git init -q -b screenshots
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        echo "Screenshots of ${{ github.sha }} (${{ github.ref_name }})" > README.md
        git add -A && git commit -q -m "LiveCD screenshots for ${{ github.sha }}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
